workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# Defaults are GitLab.com runners. Override LINUX_RUNNER_TAG and
# WINDOWS_RUNNER_TAG in project CI/CD settings to use your own.
variables:
  LINUX_RUNNER_TAG: saas-linux-small-amd64
  WINDOWS_RUNNER_TAG: saas-windows-medium-amd64

default:
  tags: [$LINUX_RUNNER_TAG]
  interruptible: true
  retry:
    max: 1
    when: [runner_system_failure]

stages:
  - test
  - release

test:
  stage: test
  tags: [$LINUX_RUNNER_TAG]
  image: python:3.12-slim
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
  cache:
    key: pip-py3.12
    paths:
      - .cache/pip
  script:
    - pip install -e .
    - pip install "pytest>=8"
    - python -m pytest -q

# Self-hosted Windows. Offered on tags, merge requests, and main pushes that
# change shipped code, tests, or packaging; it starts only when someone plays
# it and may fail, so a Windows runner that is offline never holds up a
# pipeline or a release. A manual web or API run starts it by itself.
.windows_python: &windows_python
  interruptible: true
  timeout: 20m
  variables:
    PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  cache:
    key: uv-win
    paths:
      - .cache/uv
  script:
    - |
      $ErrorActionPreference = "Stop"
      $env:PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"
      $env:UV_CACHE_DIR = Join-Path $env:CI_PROJECT_DIR ".cache/uv"
      if (-not (Get-Command uv -ErrorAction SilentlyContinue)) {
        $env:UV_INSTALL_DIR = Join-Path $env:CI_PROJECT_DIR ".uv"
        irm https://astral.sh/uv/install.ps1 | iex
        $env:Path = "$env:UV_INSTALL_DIR;$env:Path"
      }
      uv python install 3.12
      uv run --python 3.12 --group dev pytest -q

test-windows:
  <<: *windows_python
  stage: test
  tags: [$WINDOWS_RUNNER_TAG]
  needs:
    - job: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_TAG
      when: manual
      allow_failure: true
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - src/**/*
        - tests/**/*
        - pyproject.toml
        - uv.lock
      when: manual
      allow_failure: true

# Same tests on a GitLab-hosted runner. Starts only when someone plays it.
windows:hosted:
  <<: *windows_python
  stage: test
  tags: [saas-windows-medium-amd64]
  allow_failure: true
  needs:
    - job: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
    - if: $CI_COMMIT_TAG
      when: manual
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"
      when: manual
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - src/**/*
        - tests/**/*
        - pyproject.toml
        - uv.lock
      when: manual

release-check:
  stage: test
  tags: [$LINUX_RUNNER_TAG]
  image: python:3.12-slim
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - |
      python3 - <<'PY'
      import os, re, sys, tomllib
      from pathlib import Path
      tag = os.environ["CI_COMMIT_TAG"]
      version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
      if tag != f"v{version}":
          sys.exit(f"tag {tag} does not match pyproject version {version}")
      newest = re.search(r"^## \[([^\]]+)\](.*)$", Path("CHANGELOG.md").read_text(encoding="utf-8"), re.M)
      if not newest or newest.group(1) != version:
          sys.exit(f"the newest CHANGELOG section is not {version}")
      if "unreleased" in newest.group(2).lower():
          sys.exit(f"CHANGELOG {version} still says Unreleased")
      print(f"{tag} matches pyproject.toml and CHANGELOG.md")
      PY

release:
  stage: release
  tags: [$LINUX_RUNNER_TAG]
  image: python:3.12-slim
  interruptible: false
  variables:
    PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - |
      set -eu
      arch="$(dpkg --print-architecture)"
      python3 - "$arch" <<'PY'
      import os, sys, urllib.request
      arch = sys.argv[1]
      url = (
          "https://gitlab.com/gitlab-org/release-cli/-/releases/v0.24.0/downloads/bin/release-cli-linux-"
          + arch
      )
      dest = "/usr/local/bin/release-cli"
      urllib.request.urlretrieve(url, dest)
      os.chmod(dest, 0o755)
      PY
      notes="$(python3 - <<'PY'
      import os, re
      from pathlib import Path
      tag = os.environ["CI_COMMIT_TAG"]
      fallback = f"Release {tag}"
      path = Path("CHANGELOG.md")
      if not path.is_file():
          print(fallback)
          raise SystemExit
      def bare(name):
          return name[1:] if name.startswith("v") else name
      want = {bare(tag)}
      lines = path.read_text(encoding="utf-8").splitlines()
      start = None
      for index, line in enumerate(lines):
          match = re.match(r"^##\s+(?:\[)?([^\]\s]+)", line)
          if match and bare(match.group(1)) in want:
              start = index + 1
              break
      if start is None:
          print(fallback)
          raise SystemExit
      body = []
      for line in lines[start:]:
          if line.startswith("## "):
              break
          body.append(line)
      print("\n".join(body).strip() or fallback)
      PY
      )"
      pip install build
      python -m build
      python3 - <<'PY'
      import os, pathlib, urllib.request
      tag = os.environ["CI_COMMIT_TAG"]
      base = os.environ["CI_API_V4_URL"] + "/projects/" + os.environ["CI_PROJECT_ID"] + "/packages/generic/muse-web-cli/" + tag + "/"
      for path in pathlib.Path("dist").iterdir():
          request = urllib.request.Request(
              base + path.name,
              data=path.read_bytes(),
              method="PUT",
              headers={"JOB-TOKEN": os.environ["CI_JOB_TOKEN"]},
          )
          with urllib.request.urlopen(request) as response:
              print(path.name, response.status)
      PY
      asset_args=()
      for f in dist/*; do
        name="$(basename "$f")"
        url="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/muse-web-cli/${CI_COMMIT_TAG}/${name}"
        asset_args+=(--assets-link "{\"name\":\"${name}\",\"url\":\"${url}\",\"link_type\":\"package\"}")
      done
      if ! release-cli create --name "$CI_COMMIT_TAG" --tag-name "$CI_COMMIT_TAG" --description "$notes" "${asset_args[@]}"; then
        status="$(python3 - <<'PY'
      import os, urllib.error, urllib.parse, urllib.request
      tag = urllib.parse.quote(os.environ["CI_COMMIT_TAG"], safe="")
      url = (
          os.environ["CI_API_V4_URL"]
          + "/projects/"
          + os.environ["CI_PROJECT_ID"]
          + "/releases/"
          + tag
      )
      request = urllib.request.Request(url, headers={"JOB-TOKEN": os.environ["CI_JOB_TOKEN"]})
      try:
          with urllib.request.urlopen(request) as response:
              print(response.status)
      except urllib.error.HTTPError as exc:
          print(exc.code)
      PY
      )"
        if [ "$status" = "200" ]; then
          echo "Release $CI_COMMIT_TAG already exists"
          exit 0
        fi
        echo "Release $CI_COMMIT_TAG was not created (HTTP $status)"
        exit 1
      fi
