<!-- Sanitized fragment of the logged-in Muse shell (2026-10-07).
     The dropdown trigger is gone. The dock chat control is the switcher.
     The side-chat row below is a stand-in, not copied from a logged-in page.
     Row markers for a sidebar that actually has chats were not sampled. -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head><title>Muse</title></head>
<body>
<div data-testid="hatch-side-chats-panel-shell">
  <nav aria-label="副聊天室">
    <div data-testid="hatch-side-chats-panel-content">
      <h1>側欄裡的標題</h1>
      <div data-testid="hatch-chat-search-toolbar">
        <div data-testid="hatch-chat-search-field">
          <input aria-label="搜尋" />
        </div>
        <button type="button" data-testid="hatch-side-chats-options" aria-label="副聊天室選項" aria-expanded="false"></button>
      </div>
      <div>
        <h3>開始副聊天室</h3>
        <p>副聊天室是依主題整理對話的選用方式。</p>
        <button type="button">新副聊天室</button>
        <a href="#fake-side" aria-current="page">假側欄對話</a>
        <button type="button">假另一則</button>
      </div>
    </div>
  </nav>
</div>
<h1>假文件標題</h1>
<div role="log" aria-label="聊天訊息"><h1>紀錄裡的標題</h1></div>
<textarea aria-label="傳送訊息"></textarea>
<div role="button" data-hatch-avatar-interaction aria-label="Muse"></div>
<div data-testid="hatch-dock-rail">
  <a
    href="/"
    data-testid="hatch-nav-chat"
    aria-label="聊天室"
    aria-current="page"
    aria-expanded="true"
    data-hatch-shell-navigation="true"
    data-pel-click="chat_tab_click"
  >
    <span class="relative inline-flex"></span>
  </a>
</div>
</body>
</html>
