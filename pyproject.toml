[project]
name = "muse-web-cli"
version = "0.1.0"
description = "Drive your own logged-in Meta Muse web app from the terminal."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["playwright>=1.49,<2"]

[project.urls]
Homepage = "https://gitlab.com/aa22396584/muse-web-cli"
Repository = "https://gitlab.com/aa22396584/muse-web-cli"
Changelog = "https://gitlab.com/aa22396584/muse-web-cli/-/blob/main/CHANGELOG.md"
Issues = "https://gitlab.com/aa22396584/muse-web-cli/-/issues"

[project.scripts]
muse-web-cli = "muse_web_cli.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
